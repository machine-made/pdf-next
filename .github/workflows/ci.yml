name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ./src-tauri -> target

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        working-directory: src-tauri
        run: cargo build --release

      - name: Tests
        working-directory: src-tauri
        run: cargo test

      - name: Frontend contract checks
        run: node tools/check_frontend.mjs

      - name: What an agent reads stays within budget
        if: matrix.platform == 'ubuntu-latest'
        run: node tools/agent_cost.mjs --check --bin src-tauri/target/release/pdf-next

      - name: Fixtures are what the script writes
        run: |
          python3 tests/make_fixtures.py
          git diff --exit-code tests/fixtures

  # The frontend in Chromium against a mocked backend: panes, the review card,
  # toolbar, editing keys, and axe-core accessibility checks.
  browser:
    name: browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bunx playwright install --with-deps chromium

      - name: Browser tests, with line coverage of src/*.mjs
        run: node tests/browser/run.mjs --coverage

      - name: Screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-screenshots
          path: ${{ runner.temp }}/pdf-next-browser
          if-no-files-found: ignore

  # Rust line coverage of the test suite, printed in the log. Not a gate.
  coverage:
    name: rust coverage
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked

      - name: Coverage summary
        working-directory: src-tauri
        run: cargo llvm-cov --summary-only

  # The real app, Rust backend and WebKitGTK webview, driven over WebDriver by
  # tauri-driver: a Markdown page renders and reloads, a review saved in the
  # window reaches the sidecar and the agent view, and `pdf-next reviews done`
  # turns it applied in the open window. Then the website's screenshots, taken
  # in that window and checked by their pixels, kept as the run's artifact.
  e2e:
    name: e2e (real app, Linux)
    # WebKitWebDriver (webkit2gtk-driver) is verified on Ubuntu 24.04;
    # ubuntu-latest is moving to 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            webkit2gtk-driver xvfb python3-pil

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ./src-tauri -> target

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.1.0 --locked

      - name: Build the app
        id: build
        run: bunx tauri build --no-bundle

      - name: Drive the app
        run: xvfb-run -a node tests/e2e/app.mjs

      # Split panes and Night pages once looked right in Chromium and wrong in
      # this window (fixed in 0.17.1); these pictures and their pixel checks
      # are what would have shown it.
      - name: Website screenshots in the real window
        if: always() && steps.build.outcome == 'success'
        run: >-
          xvfb-run -a -s '-screen 0 3200x2000x24'
          node tools/screenshots.mjs --bin src-tauri/target/release/pdf-next --out "$RUNNER_TEMP/pdf-next-shots"

      - name: Keep the screenshots
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-window-screenshots
          path: ${{ runner.temp }}/pdf-next-shots
          if-no-files-found: ignore

  # The check job above never starts the app. This one does: it builds the
  # bundle a reader installs, opens every fixture in it, and fails if the
  # window comes up without the document in it. 0.9.0 passed every check above
  # and still opened blank on macOS.
  smoke:
    name: smoke ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            xvfb

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ./src-tauri -> target

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # The bundle, not a bare `cargo build`: on macOS the app that ships is
      # the one inside pdf-next.app, and WebKit does not treat a loose binary
      # the same way.
      - name: Bundle
        run: bun run build

      - name: Scan the Windows bundles with Defender
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./tools/defender-scan.ps1

      - name: Open every fixture
        if: matrix.platform != 'ubuntu-latest'
        run: node tools/smoke.mjs

      # No display on a Linux runner; the viewer needs one to have a webview.
      - name: Open every fixture
        if: matrix.platform == 'ubuntu-latest'
        run: xvfb-run -a node tools/smoke.mjs
