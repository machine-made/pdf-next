name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: Windows (.exe, .msi)
            args: ''
            rust-targets: ''
          - platform: macos-latest
            label: macOS universal (.dmg)
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: ubuntu-latest
            label: Ubuntu (.AppImage, .deb)
            args: ''
            rust-targets: ''

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            xvfb

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ./src-tauri -> target

      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Frontend regressions and release version
        run: node tools/check_frontend.mjs

      - name: Rust regressions
        working-directory: src-tauri
        run: cargo test --locked

      # Windows binaries are signed with Azure Trusted Signing when the
      # repository holds the credentials; without them the build is the same,
      # just unsigned. See docs/distribution.md for the Azure side. Secrets:
      # AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET. Variables:
      # AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE.
      # The sign command is handed to Tauri as a config overlay, so a build
      # without credentials never sees it and the shared config stays
      # platform-neutral.
      - name: Prepare code signing
        id: signing
        if: matrix.platform == 'windows-latest' && env.HAS_SIGNING == 'true'
        env:
          HAS_SIGNING: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
          ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        shell: pwsh
        run: |
          cargo install trusted-signing-cli --version 0.11.0 --locked
          $command = "trusted-signing-cli -e $env:ENDPOINT -a $env:ACCOUNT -c $env:PROFILE %1"
          @{ bundle = @{ windows = @{ signCommand = $command } } } |
            ConvertTo-Json -Depth 5 |
            Set-Content -Path signing.conf.json -Encoding utf8
          "args=--config signing.conf.json" >> $env:GITHUB_OUTPUT

      # The release notes are the version's CHANGELOG.md section; a version
      # without one stops here, before anything is built or published.
      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<PDF_NEXT_NOTES'
            node tools/release_notes.mjs "$GITHUB_REF_NAME"
            echo 'PDF_NEXT_NOTES'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: pdf-next ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          # Held as a draft until every platform's bundle has opened a
          # document. Nothing is announced, and nothing a package manager
          # follows moves, until the publish job below says so.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} ${{ steps.signing.outputs.args }}

      # The gate this repository did not have. tauri-action proves a bundle
      # can be built; this proves the bundle opens a document. 0.9.0 built
      # cleanly and opened blank on macOS.
      - name: Open a document in the bundle that was just built
        if: matrix.platform != 'ubuntu-latest'
        run: node tools/smoke.mjs

      # Runs while the release is still a draft, so a flagged build is never shown.
      - name: Scan the Windows bundles with Defender
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./tools/defender-scan.ps1

      - name: Open a document in the bundle that was just built
        if: matrix.platform == 'ubuntu-latest'
        run: xvfb-run -a node tools/smoke.mjs

  # Windows code signing through the SignPath Foundation (free for open
  # source; the certificate names "SignPath Foundation" as publisher). Off
  # until the repository variable SIGNPATH_ORGANIZATION_ID and the secret
  # SIGNPATH_API_TOKEN exist; without them a release is exactly what it was.
  # See docs/code-signing.md.
  #
  # The installers carry the application binary inside them, so the binary
  # is signed first and the installers are then built around it and signed
  # in turn. Each signing request waits for a person to approve it in
  # SignPath. The signed files replace the unsigned ones in the draft, after
  # the same smoke test and Defender scan, and only then does publish run.
  sign-windows:
    name: sign the Windows build
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: windows-latest
    env:
      SIGNPATH_PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG || 'pdf-next' }}
      SIGNPATH_POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ./src-tauri -> target

      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./src-tauri/tauri.conf.json').version"
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME is not v$version" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build the application binary
        run: bunx tauri build --no-bundle

      - name: Stage the binary for signing
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force unsigned-app | Out-Null
          Copy-Item src-tauri/target/release/pdf-next.exe unsigned-app/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload-app
        with:
          name: unsigned-app
          path: unsigned-app/

      - name: Sign the application binary
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: pdf-next-app
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-app

      - name: Build the installers around the signed binary
        shell: pwsh
        run: |
          Copy-Item -Force signed-app/pdf-next.exe src-tauri/target/release/pdf-next.exe
          bunx tauri bundle --bundles nsis,msi
          New-Item -ItemType Directory -Force unsigned-installers | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe unsigned-installers/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi unsigned-installers/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload-installers
        with:
          name: unsigned-installers
          path: unsigned-installers/

      - name: Sign the installers
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: pdf-next-installers
          github-artifact-id: ${{ steps.upload-installers.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installers

      - name: Check every signature
        shell: pwsh
        run: |
          foreach ($file in @('signed-app/pdf-next.exe') + (Get-ChildItem signed-installers/* -Include *.exe, *.msi).FullName) {
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne 'Valid') { throw "$file is not validly signed: $($signature.Status)" }
            Write-Host "$file signed by $($signature.SignerCertificate.Subject)"
          }

      # The smoke test and the Defender scan read the bundle folder, so the
      # signed installers go back where they were built.
      - name: Put the signed installers in the bundle folder
        shell: pwsh
        run: |
          Copy-Item -Force signed-installers/*.exe src-tauri/target/release/bundle/nsis/
          Copy-Item -Force signed-installers/*.msi src-tauri/target/release/bundle/msi/

      - name: Open a document in the signed build
        run: node tools/smoke.mjs

      - name: Scan the signed installers with Defender
        shell: pwsh
        run: ./tools/defender-scan.ps1

      - name: Replace the unsigned Windows files in the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $files = (Get-ChildItem signed-installers/* -Include *.exe, *.msi).FullName
          gh release upload $env:GITHUB_REF_NAME $files --clobber --repo $env:GITHUB_REPOSITORY

  # Every bundle built and opened a document, so the release can be seen.
  # Until this runs the release is a draft: the tap's livecheck, winget and
  # the app's own update check all read the latest *published* release, so a
  # build that failed the gate is one nobody is offered.
  publish:
    name: publish the release
    needs: [bundle, sign-windows]
    # Signing is skipped while SignPath is not configured; a skipped job is
    # fine, a failed one (a refused or timed-out signature) keeps the draft.
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') &&
      needs.bundle.result == 'success' &&
      (needs.sign-windows.result == 'success' || needs.sign-windows.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # winget is given the tag's version and the installer named after it,
      # so a tag that is not the built version would point it at a missing file.
      - name: Check the tag is the built version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          package_version=$(node -p "require('./package.json').version")
          tauri_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          test "$package_version" = "$tauri_version"
          test "$TAG" = "v$package_version"

      - name: Undraft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  # always(): a skipped job upstream (signing, when it is not set up) would
  # otherwise skip everything after publish, as it did from 0.16.2 to 0.16.4.
  winget:
    needs: publish
    if: always() && needs.publish.result == 'success' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/winget.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

  apt:
    needs: publish
    if: always() && needs.publish.result == 'success' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/apt.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
