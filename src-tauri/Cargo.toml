[package]
name = "pdf-next"
version = "0.18.0"
description = "Tiny, fast PDF, image and markdown viewer that reloads when the file changes"
authors = ["machine-made"]
license = "MIT"
repository = "https://github.com/machine-made/pdf-next"
edition = "2021"
rust-version = "1.96"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# A second `pdf-next file.pdf` hands its files to the running window as tabs
# and returns at once, instead of opening a second viewer.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tempfile = "3.20"
# Keep review transactions attached to the directory admitted with the document.
cap-std = "4.0.3"
# Markdown is parsed and sanitized on this side of the IPC boundary: the
# webview only ever sees HTML that ammonia has already scrubbed.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ammonia = "4"
percent-encoding = "2"
# NFKC for the agent view: the math alphabet's 𝑣 reads as v there.
unicode-normalization = "0.1"
# Hands a release download URL to the default browser — the one URL the
# frontend may ask to open, and it is checked in Rust first.
open = "5"
# TeX to MathML Core. Pinned: the allowlist in main.rs lists the tags and
# attributes this version writes, and a test fails if an upgrade adds one.
math-core = { version = "=0.9.0", default-features = false }
# Pure-Rust PDF shrink (no Ghostscript). Writes `{stem}_reduced.pdf`.
picamatl = "0.4"
# Use the same parser as picamatl to bound load-time stream decompression.
lopdf = { version = "0.44", default-features = false }
# Fuzzy search for a review quote near its old line, for `reviews relocate`.
diff-match-patch-rs = "0.5.1"

# A file dropped on the window arrives as a list of paths that can be empty:
# macOS carries the names on more than one pasteboard type and the webview
# reads only the older one. Reading the drag pasteboard directly recovers
# them. Both crates come in with tauri; the versions are pinned to its own so
# the interfaces are the same types.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSView"] }
# NSFileManager and NSError move a file to the Trash.
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSError",
    "NSFileManager",
    "NSString",
    "NSURL",
] }

# GIO moves a file to the user's trash. It comes in with tauri's GTK stack;
# the version is pinned to that one.
[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.22"

# The release binary is a GUI-subsystem executable, which has no console of its
# own; attaching to the parent's is what lets `--help` and `opened …` print.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_Console",
    "Win32_Graphics_Printing",
    # SHFileOperationW, which sends a file to the Recycle Bin, and
    # GetDriveTypeW, which tells a network drive that has none.
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
] }
# Printing goes to the system print window, not WebView2's in-page preview:
# that is ShowPrintUI(SYSTEM), and reaching it means talking to the WebView2
# controller Tauri already owns. Both crates come in with tauri; the versions
# are pinned to its own so the interfaces are the same types.
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation"] }

# Property tests of the review store and the Markdown sanitizer (src/properties.rs).
[dev-dependencies]
proptest = { version = "1.12", default-features = false, features = ["std"] }

# Small and fast beats fast-to-build: this binary is shipped, not iterated on.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
# Unwinding lets `render_math` show an equation whose conversion panics as
# source instead of closing the window on a hostile file. It costs 1.4 MB on
# Linux (13.4 MB against 12.0 MB).
panic = "unwind"
strip = true
